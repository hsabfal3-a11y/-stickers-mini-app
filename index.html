<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticker Drop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body {
      font-family: Arial, Tahoma, sans-serif;
      background-color: var(--tg-theme-bg-color, #182222);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .box {
      background-color: var(--tg-theme-secondary-bg-color, #22303c);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background-color: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Sticker Drop</h2>
    <p>شاهد الإعلان أولاً ثم احصل على حزمة الملصقات.</p>
    <button class="btn" id="claimBtn" onclick="watchAdAndGetStickers()">سحب الملصقات</button>
    <div class="status" id="statusText">جاهز</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const AD_BLOCK_ID = "int-61742";
    const STICKER_PACK_URL = "https://t.me/addstickers/Animals";
    const AdController = window.Adsgram?.init({ blockId: AD_BLOCK_ID });

    async function watchAdAndGetStickers() {
      const statusEl = document.getElementById("statusText");
      const btnEl = document.getElementById("claimBtn");

      if (!AdController) {
        statusEl.textContent = "تعذر تحميل نظام الإعلانات، تأكد من فتح التطبيق داخل تيليجرام.";
        return;
      }

      btnEl.disabled = true;
      statusEl.textContent = "جاري تحميل الإعلان...";

      try {
        await AdController.show();
        statusEl.textContent = "تمت مشاهدة الإعلان بنجاح، جاري فتح الملصقات...";

        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(STICKER_PACK_URL);
        } else {
          window.open(STICKER_PACK_URL, "_blank");
        }
      } catch (err) {
        statusEl.textContent = "يرجى إكمال مشاهدة الإعلان أولاً للحصول على الملصقات.";
      } finally {
        btnEl.disabled = false;
      }
    }
  </script>
</body>
</html>
