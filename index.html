
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Sticker Drop</title>

  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

  <!-- TADS Ads SDK -->
  <script src="https://w.tads.me/widget.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: #182438;
      --panel-2: #202f46;
      --text: #f5f7fb;
      --muted: #aab7ca;
      --accent: #55d6a5;
      --accent-dark: #163f39;
      --border: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%, rgba(85,214,165,.13), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top {
      text-align: center;
      padding: 14px 8px 4px;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border-radius: 25px;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(145deg, #244d55, #1d344c);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 14px 35px rgba(0,0,0,.22);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: linear-gradient(160deg, var(--panel), #152033);
      box-shadow: 0 18px 45px rgba(0,0,0,.18);
    }

    .art {
      min-height: 150px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 45%, rgba(85,214,165,.16), transparent 55%),
        var(--panel-2);
      font-size: 68px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      text-align: center;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      text-align: center;
    }

    .claim-btn {
      width: 100%;
      min-height: 54px;
      margin-top: 20px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #62e5b2, #39bd91);
      color: #09271f;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(57,189,145,.2);
      transition: transform .15s ease, opacity .15s ease;
    }

    .claim-btn:active { transform: scale(.98); }
    .claim-btn:disabled { opacity: .55; cursor: wait; }

    .hint {
      margin: 12px 2px 0;
      min-height: 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    /* TADS advertisement area */
    .ad-section {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
    }

    #tads-container-13544 {
      width: 100%;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-item {
      padding: 14px 10px;
      border-radius: 15px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
      text-align: center;
    }

    .info-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .info-item span {
      color: var(--muted);
      font-size: 12px;
    }

    footer {
      color: #8492a8;
      font-size: 11px;
      text-align: center;
      padding: 2px 8px;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="top">
      <div class="logo" aria-hidden="true">🎁</div>
      <h1>Sticker Drop</h1>
      <p class="subtitle">احصل على ملصقات تيليجرام المميزة بسهولة</p>
    </header>

    <section class="card">
      <div class="art" aria-hidden="true">🧸✨</div>
      <h2>حزمة الملصقات</h2>
      <p class="description">
        اضغط على الزر للانتقال إلى حزمة الملصقات وإضافتها إلى حسابك على تيليجرام.
      </p>

      <button class="claim-btn" id="claimBtn" type="button">
        🎉 سحب الملصقات
      </button>

      <p class="hint" id="statusText" aria-live="polite">
        مرحباً بك! يتم تجهيز التطبيق...
      </p>
    </section>

    <!-- TADS TGB Advertisement -->
    <section class="ad-section">
      <div id="tads-container-13544"></div>
    </section>

    <section class="info" aria-label="معلومات التطبيق">
      <div class="info-item">
        <strong>⚡ سريع وسهل</strong>
        <span>خطوات بسيطة</span>
      </div>

      <div class="info-item">
        <strong>💚 مجاني</strong>
        <span>أضف الملصقات إلى تيليجرام</span>
      </div>
    </section>

    <footer>Sticker Drop · تجربة ملصقات تيليجرام</footer>

  </main>

  <script>
    (() => {
      "use strict";

      const STICKER_PACK_URL = "https://t.me/addstickers/Animals";

      // TADS Widget ID
      const TADS_WIDGET_ID = 13544;

      const tg = window.Telegram && window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

      const claimBtn = document.getElementById("claimBtn");
      const statusText = document.getElementById("statusText");

      function setStatus(message) {
        statusText.textContent = message;
      }

      function startTelegramApp() {
        if (!tg) {
          setStatus("افتح التطبيق من داخل تيليجرام للحصول على أفضل تجربة.");
          return;
        }

        try {
          tg.ready();
          tg.expand();
        } catch (error) {
          console.warn("Telegram WebApp initialization:", error);
        }

        setStatus("التطبيق جاهز. يمكنك فتح حزمة الملصقات.");
      }

      // Initialize TADS advertisement
      function startTads() {
        if (!window.tads || typeof window.tads.init !== "function") {
          console.error("TADS SDK لم يتم تحميله.");
          return;
        }

        try {
          const adController = window.tads.init({
            widgetId: TADS_WIDGET_ID,
            type: "static",
            debug: false,

            onAdsNotFound: () => {
              console.log("TADS: No ads found to show.");
            }
          });

          window.tadsAdController = adController;

          adController.loadAd()
            .then(() => {
              return adController.showAd();
            })
            .then(() => {
              console.log("TADS advertisement loaded and displayed.");
            })
            .catch((error) => {
              console.error("TADS advertisement error:", error);
            });

        } catch (error) {
          console.error("TADS initialization error:", error);
        }
      }

      // Open sticker pack
      claimBtn.addEventListener("click", () => {
        claimBtn.disabled = true;
        setStatus("جارٍ فتح حزمة الملصقات...");

        try {
          if (tg && typeof tg.openTelegramLink === "function") {
            tg.openTelegramLink(STICKER_PACK_URL);
          } else {
            window.open(
              STICKER_PACK_URL,
              "_blank",
              "noopener,noreferrer"
            );
          }
        } catch (error) {
          console.error("Opening sticker pack failed:", error);
          window.location.href = STICKER_PACK_URL;
        }

        window.setTimeout(() => {
          claimBtn.disabled = false;
          setStatus("إذا لم تفتح الحزمة، اضغط على الزر مرة أخرى.");
        }, 1800);
      });

      // Start application and advertisement
      startTelegramApp();
      startTads();

    })();
  </script>
</body>
</html>
