<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticker Drop</title>
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
      const adexiumWidget = new AdexiumWidget({
        wid: "7289371f-0617-4b1b-95a5-05dc1cd56a8d",
        adFormat: "interstitial"
      });
      adexiumWidget.autoMode();
    });
  </script>
  <style>
    body {
      font-family: Arial, Tahoma, sans-serif;
      background-color: var(--tg-theme-bg-color, #182222);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .box {
      background-color: var(--tg-theme-secondary-bg-color, #22303c);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background-color: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Sticker Drop</h2>
    <p>شاهد الإعلان أولاً ثم احصل على حزمة الملصقات.</p>
    <button class="btn" id="claimBtn" onclick="claimStickers()">سحب الملصقات</button>
    <div class="status" id="statusText">جاهز</div>
  </div>

  <script type="text/javascript">
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const STICKER_PACK_URL = "https://t.me/addstickers/Animals";

    function claimStickers() {
      const statusEl = document.getElementById("statusText");
      const btnEl = document.getElementById("claimBtn");

      btnEl.disabled = true;
      statusEl.textContent = "جاري فتح الملصقات...";

      try {
        if (tg && typeof tg.sendData === "function") {
          tg.sendData("ad_watched");
        }

        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(STICKER_PACK_URL);
        } else {
          window.open(STICKER_PACK_URL, "_blank");
        }
      } catch (err) {
        statusEl.textContent = "تعذر فتح الرابط، حاول مرة أخرى.";
      } finally {
        btnEl.disabled = false;
      }
    }
  </script>
</body>
</html>
